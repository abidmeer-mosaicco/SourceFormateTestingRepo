<template>
  <div class="slds-grid slds-wrap slds-grid_align-center">
    <div class="slds-col slds-grow-none slds-m-bottom_medium">
      <h3>{labels.pmc_registration_digitalHubTitle}</h3>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
      <lightning-formatted-text class="dxp-text-body digital-hub-profile-text"
        value={labels.pmc_registration_selectActivitiesDigitalHub}>
      </lightning-formatted-text>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-grid slds-wrap">
      <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2" for:each={_preferenceList} for:item="checkbox"
        key={checkbox.value}>
        <lightning-input type="checkbox" label={checkbox.label} checked={checkbox.checked}
          onchange={handleChangeCheckbox} value={checkbox.value}>
        </lightning-input>
      </div>
    </div>
    <div class="slds-col slds-size_1-of-1 slds-grid slds-grid_align-center slds-m-top_medium mobile-button">
      <lightning-button class="digital-hub-button" variant="brand" disabled={isDisabled} onclick={handleProceed}
        label={labels.pmc_registration_proceed}>
      </lightning-button>
    </div>
  </div>
</template>
