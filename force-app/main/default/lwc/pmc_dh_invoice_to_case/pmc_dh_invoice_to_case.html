<template>
     
<lightning-card title="Related Cases" icon-name="standard:case">
        <lightning-button slot="actions" label="New Case" onclick={handleNewCase}></lightning-button>
        <div class="slds-m-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <lightning-datatable
                    key-field="Id"
                    data={displayedCases}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
                <template if:true={showViewAll}>
                    <div class="slds-text-align_right slds-m-top_small">
                        <a onclick={handleViewAll} class="slds-text-link">View All</a>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

<template if:true={showNewCaseModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Case</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-edit-form object-api-name="Case" onsubmit={handleSubmit} onsuccess={handleSuccess}>
                        <lightning-messages></lightning-messages>
                        
                        <!-- Pre-populated fields -->
                        <lightning-input-field field-name="AccountId" value={invoiceDetails.AccountId} ></lightning-input-field>
                        <lightning-input-field field-name="ContactId" value={invoiceDetails.ContactId} ></lightning-input-field>
                       
                        <lightning-input-field field-name="Subject"></lightning-input-field>
                        <lightning-input-field field-name="Description"></lightning-input-field>
                        <lightning-input-field field-name="Status"></lightning-input-field>
                        <lightning-input-field field-name="Priority"></lightning-input-field>
                        <lightning-input-field field-name="Type"></lightning-input-field>
                        <lightning-input-field field-name="Origin"></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_Order__c" value={invoiceDetails.PMC_SS_Order__c}></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_SAPOrderNumber__c" value={invoiceDetails.PMC_SS_SAPOrderNumber__c}></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_SoldToAccount__c" value={invoiceDetails.PMC_SS_SoldToAccount__c}></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_SAPInvoiceNumber__c" value={invoiceDetails.PMC_SS_SAPInvoiceNumber__c}></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_Invoice__c" value={invoiceDetails.PMC_SS_Invoice__c}></lightning-input-field>
                        <lightning-input-field field-name="Customer_Purchase_Order__c" value={invoiceDetails.Customer_Purchase_Order__c}></lightning-input-field>
                        <lightning-input-field field-name="PMC_SS_OriginalInvoiceAmount__c" value={invoiceDetails.PMC_SS_OriginalInvoiceAmount__c}></lightning-input-field>

                        <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal} class="slds-m-right_x-small"></lightning-button>
                        <!-- Show spinner when the form is submitting, otherwise show the Save button -->
                        <template if:true={isSubmitting}>
                            <lightning-spinner alternative-text="Submitting" size="small"></lightning-spinner>
                        </template>
                        <template if:false={isSubmitting}>
                            <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                        </template>
                    </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
