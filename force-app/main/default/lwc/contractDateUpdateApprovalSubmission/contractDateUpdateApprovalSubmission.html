<template>
    <div class="slds-var-m-top_medium">
        <div class="slds-grid slds-wrap slds-var-m-bottom_small slds-grid_vertical-align-center">
            <div class="slds-col slds-grow">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure slds-var-m-left_small">
                        <lightning-icon icon-name="standard:contract" size="small" alternative-text="Contract Amendments"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-text-heading_small">Eligible Amendments ({lines.length})</h2>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-no-flex slds-var-p-right_x-small">
                <lightning-button label="Submit for Approval" variant="brand" onclick={handleSubmitForApproval}></lightning-button>
            </div>
            <div class="slds-col slds-no-flex">
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={handleRefresh} variant="border-filled" size="small"></lightning-button-icon>
            </div>
        </div>
        <lightning-datatable key-field="Id" data={eligibleLines} columns={columns} onrowselection={handleRowSelection} selected-rows={selectedIds} onrowaction={handleRowAction}></lightning-datatable>
    </div>
</template>
