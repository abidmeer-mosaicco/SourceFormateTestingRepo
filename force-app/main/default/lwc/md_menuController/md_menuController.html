<template>
    <div class="md-menu-container">
        <nav class="md-menu" lwc:if={hasMenu}>
            <ul class="md-menu-list">
                <template for:each={menuItems} for:item="item">

                    <template lwc:if={item.children}>
                        <li key={item.featureKey} class="md-menu-item md-menu-item--dropdown"
                            data-key={item.featureKey}
                            onmouseenter={handleDropdownEnter}
                            onmouseleave={handleDropdownLeave}>

                            <a href={item.url} class={item.linkClass}>
                                {item.label}
                                <span class="md-chevron" aria-hidden="true">&#9660;</span>
                            </a>

                            <ul lwc:if={item.isOpen} class="md-dropdown-menu">
                                <template for:each={item.children} for:item="child">
                                    <li key={child.featureKey} class="md-dropdown-item">
                                        <a href={child.url} class={child.linkClass}>{child.label}</a>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>

                    <template lwc:else>
                        <li key={item.featureKey} class="md-menu-item">
                            <a href={item.url} class={item.linkClass}>{item.label}</a>
                        </li>
                    </template>

                </template>
            </ul>
        </nav>

        <div lwc:if={isAdmin} class="md-admin-region-selector">
            <lightning-combobox 
                name="regionConfig"
                value={selectedRegion}
                options={regionOptions}
                onchange={handleRegionChange}
                variant="label-hidden"
            ></lightning-combobox>
        </div>
    </div>
</template>
