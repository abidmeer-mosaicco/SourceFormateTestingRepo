<template>
  <template if:true={pageLoaded}>
    <c-pmc_dh_search-filters search-input-label={labels.pmc_quoteHistory_searchQuotes} filters={filters}
      onsearchev={handleSearch} onapplyfilterev={handleApplyFilter} onclearfilterev={clearFilters}
      onclearsearchinputsev={clearSearchInputs}>
    </c-pmc_dh_search-filters>
    <template if:false={isResultSetEmpty}>
      <c-pmc_dh_custom-datatable table-description={labels.pmc_quoteHistory_quoteHistory} columns={columns}
        table-data={filteredData} default-sort-order={defaultSortOrder} onrowlinkclick={navigateToQuoteDetails}
        ondynamiclinkclick={navigateToQuoteDetails}>
      </c-pmc_dh_custom-datatable>
    </template>
    <template if:true={quoteList.length}>
      <div class="pagination slds-m-bottom_medium">
        <c-pmc_dh_pagination generickey="id" genericdata={quoteList} class="mydatatable slds-table_striped"
          no-of-records-per-page={recordsPerPage} button-limit="2" onpaginationchange={updatePaginatedData} modal-theme>
        </c-pmc_dh_pagination>
      </div>
    </template>
    <div lwc:if={isResultSetEmpty} class="no-results-msg">
      {labels.pmc_orderHistory_noResultsMsg}
    </div>
  </template>

  <template if:true={isSpinner}>
    <c-pmc_dh_spinner is-spinner> </c-pmc_dh_spinner>
  </template>
</template>
