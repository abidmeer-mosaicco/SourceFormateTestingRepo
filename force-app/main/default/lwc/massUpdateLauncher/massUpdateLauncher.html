<template>
    <div class="slds-var-p-around_medium">
        <div class="slds-box slds-grid_vertical-align-center slds-var-m-bottom_large slds-page-header slds-page-header_record-home">
            <div class="slds-media">
                <div if:false={activeFeature} class="slds-media__figure slds-var-m-right_medium">
                    <span class="slds-icon_container slds-icon-standard-orders" title={labels.iconAlt}>
                        <lightning-icon 
                            icon-name="standard:orders" 
                            alternative-text={labels.iconAlt}
                            size="large"
                        >
                        </lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <template if:true={activeFeature}>
                    <h1 class="slds-text-heading_medium">
                            <div class="slds-var-m-around_small">
                                <lightning-button
                                    icon-name="utility:back"
                                    label={labels.buttonBack}
                                    alternative-text={labels.buttonBack}
                                    title={labels.buttonBack}
                                    variant="neutral"
                                    onclick={handleCloseFeature}
                                    class="slds-var-m-right_medium slds-text-body_regular"
                                >
                                </lightning-button>
                                <span>{activeFeature.label}</span>
                            </div>
                        </h1>
                    </template>
                    <template if:false={activeFeature}>
                        <div style="font-size:var(--slds-g-font-scale-5);font-weight:var(--slds-g-font-weight-6)">{labels.title}</div>
                    </template>
                    <p class="slds-text-body_regular" if:false={activeFeature}>
                        {labels.description}
                    </p>
                </div>
            </div>
        </div>
        <template if:false={activeFeature}>
            <div class="slds-grid slds-wrap slds-gutters slds-var-m-bottom_medium">
                <template for:each={features} for:item="feat">
                    <div
                        key={feat.name}
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-var-p-around_small"
                    >
                        <c-feature-button
                            label={feat.label}
                            icon-name={feat.icon}
                            description={feat.description}
                            data-name={feat.name}
                            onclick={handleFeatureSelect}
                        ></c-feature-button>
                    </div>
                </template>
            </div>
            <lightning-card title={labels.cardRecentExecutions} class="slds-var-m-top_large" icon-name="utility:real_time">
                <div class="slds-p-around_small">
                    <lightning-datatable
                        key-field="Id"
                        data={executions}
                        columns={executionColumns}
                        hide-checkbox-column="true"
                        onrowaction={handleExecutionRowAction}
                    ></lightning-datatable>
                </div>
            </lightning-card>
        </template>
        <template if:true={activeFeature}>
            <template if:true={isContractDateUpdate}>
                <c-contract-date-update
                    execution-id={executionId}
                    onclose={handleCloseFeature}
                    onexecutioncreated={handleExecutionCreated}
                ></c-contract-date-update>
            </template>
            <template if:true={isQuoteUpdate}>
                <c-quote-update
                    execution-id={executionId}
                    onclose={handleCloseFeature}
                    onexecutioncreated={handleExecutionCreated}
                ></c-quote-update>
            </template>
        </template>
    </div>
</template>
