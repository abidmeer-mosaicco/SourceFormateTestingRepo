<template>
    <lightning-quick-action-panel header={labelContract}>
        <div class="slds-p-around_medium">
            <!-- Primary Contact Details -->
            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                    <div class="slds-text-heading_small slds-m-bottom_x-small">
                        
                       {labelPrimaryContact}
                    </div>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <span class="slds-text-title">{labelName}</span>
                        <span class="slds-m-left_x-small">{primaryContactName}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <span class="slds-text-title">Email:</span>
                        <a href={emailLink} class="slds-m-left_x-small">{primaryContactEmail}</a>
                    </div>
                </div>
            </div>

            <!-- Add/Update Users -->
            <div class="slds-m-bottom_medium">
                <lightning-radio-group
                    name="addUpdateUsers"
                    label={labelSignerUpdate}
                    options={yesNoOptions}
                    value={addUsersValue}
                    type="radio"
                    onchange={handleSelection}>
                </lightning-radio-group>
            </div>

            <!-- Cancel Button Centered -->
            <div class="slds-text-align_center">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}>
                </lightning-button>
            </div>
        </div>
    </lightning-quick-action-panel>
</template>
