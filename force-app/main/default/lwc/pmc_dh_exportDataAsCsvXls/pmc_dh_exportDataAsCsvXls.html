<template>
  <div class="icon-button">
    <img src={buttonUrl} alt={titleName} tabindex="0" onclick={handleOpenModal} onkeydown={handleIconKeyDown}
      onmouseenter={handleMouseEnter} onmouseleave={handleMouseLeave} />
    <template if:true={isMouseOver}>
      <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-right btn-tooltip" role="tooltip" id="help">
        <div class="slds-popover__body tooltip-text">{titleName}</div>
      </div>
    </template>
  </div>

  <div class="addnewaddress-container">
    <c-pmc_dh_custom-modal open-modal={isOpenModal} modal-heading={labels.pmc_orderHistory_confirmDownload}
      modal-width="500px" onclosemodalevent={handleCloseModal}>
      <div class="modal-wrapper">
        <div class="slds-grid slds-wrap slds-m-around_medium">
          <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium text-heading-bold">
            <lightning-formatted-rich-text value={labels.pmc_orderHistory_confirmDownloadFile}>
            </lightning-formatted-rich-text>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium text-para2">
            <lightning-formatted-rich-text
              value={labels.pmc_orderHistory_recordsLimit}></lightning-formatted-rich-text><br />
            <!-- <lightning-formatted-rich-text
              value={labels.pmc_orderHistory_recordsLimit2}></lightning-formatted-rich-text> -->
          </div>
          <div class="slds-medium-size_1-of-2 slds-size_1-of-1 slds-medium-order_1 slds-order_2 mobile-button">
            <lightning-button variant="neutral" label={labels.pmc_modal_cancel} title={labels.pmc_modal_cancel}
              onclick={handleCloseModal}></lightning-button>
          </div>
          <div
            class="slds-medium-size_1-of-2 slds-size_1-of-1 slds-medium-order_2 slds-order_1 mobile-button action-button">
            <lightning-button variant="brand" label={labels.pmc_orderHistory_download}
              title={labels.pmc_orderHistory_download} onclick={downloadHandler}></lightning-button>
          </div>
        </div>
      </div>

      <template if:true={loadSpinner}>
        <c-pmc_dh_spinner is-spinner> </c-pmc_dh_spinner>
      </template>
    </c-pmc_dh_custom-modal>
  </div>
</template>
