<template>
  <div class="container">
    <h2 class="modal-heading slds-text-heading_medium">{labels.title}</h2>

    <div class="modal-body">
      <div class="filter-container">
        <lightning-input type="search" label={labels.input_title} value={searchTerm}
          onchange={handleSearchChange}></lightning-input>

        <div class="filters-btn-container">
          <button class="md-button md-light-button" onclick={handleSelectAll}>{labels.button1}</button>
          <button class="md-button md-light-button" onclick={handleClearAll}>{labels.button2}</button>
        </div>
      </div>

      <div class="table-wrapper slds-p-horizontal_medium">
        <div class="slds-scrollable_x slds-scrollable_y">
          <table class="slds-table slds-table_bordered slds-table_cell-buffer">
            <thead>
              <tr>
                <th>{labels.col1}</th>
                <th>{labels.col2}</th>
                <th>{labels.col3}</th>
                <th>{labels.col4}</th>
              </tr>
            </thead>

            <tbody>
              <template for:each={filteredAccounts} for:item="acc">
                <tr key={acc.accountId} data-selected={acc.selected}>
                  <td>
                    <lightning-input class="switchAccountCheckbox" type="checkbox" data-id={acc.accountId}
                      checked={acc.selected} onchange={handleCheckboxChange}> </lightning-input>
                  </td>
                  <td>{acc.accountName}</td>
                  <td>{acc.sapCustomerNumber}</td>
                  <td>{acc.shippingAddress}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <div class="save-bar slds-align_absolute-center">
        <button if:true={hasSelectedItems} class="md-button md-default-button" onclick={handleSave}>{labels.button3}</button>
      </div>
    </div>
  </div>
</template>
