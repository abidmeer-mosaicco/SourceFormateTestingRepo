<template>
  <div class="breadcrumb">
    <template for:each={crumbs} for:item="crumb" for:index="indx">
      <template if:false={crumb.isActive}>
        <a key={crumb.label} href={crumb.url} data-id={indx} data-custom-navigation={crumb.isCustomNavigation} onclick={dispatchEventToParent}>{crumb.label}</a>
        <span key={crumb.label}>{icon}</span>
      </template>
      <template if:true={crumb.isActive}>
        <lightning-formatted-text class="text" key={crumb.label} value={crumb.label}></lightning-formatted-text>
      </template>
    </template>
  </div>
</template>
