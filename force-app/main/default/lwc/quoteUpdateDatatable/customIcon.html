<template>
    <div title={typeAttributes.title} class="slds-grid">
        <div if:true={typeAttributes.showSpinner} class="slds-col slds-m-right_xx-small">
            <img src="/img/loading.gif" alt="Loading" width="16" height="16" />
        </div>
        <div if:true={typeAttributes.iconName} class="slds-grid">
            <lightning-icon
                icon-name={typeAttributes.iconName}
                class="slds-col slds-var-m-right_xx-small"
                size="small"
                variant={typeAttributes.variant}
            ></lightning-icon>
        </div>
        <template if:true={typeAttributes.text}>
            <div class={typeAttributes.textClass}>{typeAttributes.text}</div>
        </template>
    </div>
</template>
