<template>
    <lightning-quick-action-panel title="Update Case" class="slds-size_small">
        <lightning-card title={screenTitle}>
            <div class="slds-m-around_medium">
                <div class="spinner">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                        </lightning-spinner>
                    </template>
                </div>
                <!-- Action Reason -->
                <label class="slds-form-element__label" for="actionReason">
                    <abbr class="slds-required" title="required">*</abbr>{labels.select_actionReason}
                </label>
                <select class="slds-select" id="actionReason" data-name="actionReason" name="actionReason"
                    onchange={handleOnChange} required>
                    <template for:each={actionReasonValues} for:item="option">
                        <option key={option.label} class="uiInputSelectOption" value={option.value}>{option.label}</option>
                    </template>
                </select>
            

                <!-- Order -->
                <label class="slds-form-element__label" for="order">
                    <abbr class="slds-required" title="required">*</abbr>{labels.select_order}
                </label>
                <c-pmc_ss_custom-Lookup-With-Filter id="order" data-name="order" 
                data-id="order" obj-name="Order" icon-name="standard:orders" 
                search-placeholder="Search Order..."
                class="mandatory" onlookupselected={handleOnChange}
                onlookupremoved={handleOnChange} record-id={recordId}
                preselected-order-id={preselectedOrderValue}>
                </c-pmc_ss_custom-Lookup-With-Filter>


                <!-- Order Item -->
                <div class="slds-form-element">
                    <div class="slds-form-element__label" style="display: flex; align-items: center;">
                        <label for="custom-orderitem-combobox" style="margin-right: 0.5rem;">
                            <abbr class="slds-required" title="required">*</abbr>{labels.select_orderItem}
                        </label>
                    </div>
                    <div class="slds-form-element__control">
                        <div class="slds-combobox_container">
                            <div class={orderItemDropdownClass} role="combobox" aria-expanded={isOrderItemDropdownOpen} aria-haspopup="listbox">
                                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                    <input
                                        class="slds-input custom-input"
                                        placeholder="Select an Order Item"
                                        onclick={toggleOrderItemDropdown}
                                        onblur={closeOrderItemDropdown}
                                        value={selectedOrderItemLabel}
                                        auto-complete="off"
                                        id="orderitem-combobox"
                                        readonly
                                    />
                                    <button class="slds-button slds-input__icon slds-input__icon_right" onclick={openOrderItemSearchModal} style="position: absolute; right: 0.5rem;">
                                        <lightning-icon
                                            icon-name="utility:search"
                                            size="x-small"
                                            alternative-text="Search"
                                        ></lightning-icon>
                                    </button>
                                </div>

                                <!-- Dropdown list -->
                                <template if:true={isOrderItemDropdownOpen}>
                                    <div id="orderitem-listbox" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                            <template for:each={filteredOrderItems} for:item="orderItem" for:index="index">
                                                <li key={orderItem.Id} class="slds-listbox__item" role="presentation" data-id={orderItem.Id} onclick={handleOrderItemSelect}>
                                                    <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option">
                                                        <span class="slds-media__figure slds-listbox__option-icon">
                                                            <lightning-icon
                                                                icon-name="doctype:gdoc"
                                                                size="x-small"
                                                                alternative-text="Order Item"
                                                                class="slds-icon slds-icon_x-small slds-icon-text-default"
                                                            ></lightning-icon>
                                                        </span>
                                                        <span class="slds-media__body">
                                                            <div class="slds-truncate"><strong>{orderItem.OrderItemNumber}</strong></div>
                                                            <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                {orderItem.PMC_CPQ_SAPOrderLineID__c}
                                                            </div>
                                                            <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                {orderItem.productName}
                                                            </div>
                                                            <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                {orderItem.Quantity}
                                                            </div>
                                                        </span>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <template if:true={isOrderItemSearchModalOpen}>
                    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <lightning-icon icon-name="utility:search" size="small" class="slds-m-right_small" alternative-text="Search" title="Search"></lightning-icon>
                                <h2 class="slds-modal__title slds-hyphenate">Search Order Items</h2>
                            </header>

                            <div class="slds-modal__content slds-p-around_medium modalHeight">
                                <lightning-input label="Search by Name or Number" value={orderItemSearchKey} onchange={handleOrderItemSearchKeyChange}></lightning-input>
                                
                                <template if:true={filteredOrderItems}>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered  slds-table_striped slds-m-top_medium">
                                        <thead>
                                            <tr>
                                                <th>Select</th>
                                                <th>Product Number</th>
                                                <th>SAP Order Line ID</th>
                                                <th>Product</th>
                                                <th>Quantity</th>
                                                <th>Line Status</th>
                                                <th>Purchase Order #</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={filteredOrderItems} for:item="orderItem" for:index="index">
                                                <tr key={orderItem.Id}>
                                                    <td>
                                                        <input
                                                            type="radio"
                                                            name="invoiceSelection"
                                                            data-id={orderItem.Id}
                                                            value={orderItem.Id}
                                                            checked={orderItem.isSelected}
                                                            onchange={handleOrderItemCheckboxChange} />
                                                    </td>
                                                    <td>{orderItem.OrderItemNumber}</td>
                                                    <td>{orderItem.PMC_CPQ_SAPOrderLineID__c}</td>
                                                    <td class="truncate-text">{orderItem.productName}</td>
                                                    <td>{orderItem.Quantity}</td>
                                                    <td>{orderItem.PMC_CPQ_OrderLineStatus__c}</td>
                                                    <td>{orderItem.PMC_CPQ_LinePONumber__c}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>

                                <template if:false={invoices}>
                                    <p class="slds-text-color_weak slds-p-top_medium">No invoices found.</p>
                                </template>
                            </div>

                            <footer class="slds-modal__footer">
                                <lightning-button variant="neutral" label="Save" onclick={confirmOrderItemSelection}></lightning-button>
                                <lightning-button variant="neutral" label="Close" onclick={closeOrderItemSearchModal}></lightning-button>
                                
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>


                <template if:true={isReverseShipmentAction}>
                    <!-- Delivery -->
                    <label class="slds-form-element__label" for="delivery">
                        <abbr class="slds-required" title="required">*</abbr>{labels.select_delivery}
                    </label>
                    <select class="slds-select" id="delivery" data-name="delivery" name="delivery"
                        onchange={handleOnChange}>
                        <template for:each={deliveries} for:item="delivery" for:index="index">
                            <option key={delivery.Id} value={delivery.Id}>{delivery.ShipmentNumber}
                            </option>
                        </template>
                    </select>
                </template>


                <template if:true={isReturnReverseShipmentAction}>

                    <label class="slds-form-element__label" for="vehicle">
                        <abbr class="slds-required" title="required">*</abbr>{customLabels.PMC_SS_SelectDeliveryItem_FieldLabel}
                    </label>
                    <select class="slds-select" id="deliveryItem" data-name="deliveryItem" name="deliveryItem"
                        onchange={handleOnChange}>
                        <template for:each={deliveryItems} for:item="deliveryItem" for:index="index">
                            <option key={deliveryItem.Id} value={deliveryItem.Id}>{deliveryItem.ShipmentItemNumber}
                            </option>
                        </template>
                    </select>

                    <lightning-input type="text" id="VehicleId" disabled="true" label={customLabels.PMC_SS_VehicleId_FieldLabel} value={vehicleId}></lightning-input>    
                    <!-- <label class="slds-form-element__label" for="vehicle">
                        <abbr class="slds-required" title="required">*</abbr>{labels.select_vehicle}
                    </label>
                    <select class="slds-select" id="vehicle" data-name="vehicle" name="vehicle"
                        onchange={handleOnChange}>
                        <template for:each={deliveryItems} for:item="deliveryItem" for:index="index">
                            <option key={deliveryItem.Id} value={deliveryItem.Id}>{deliveryItem.VehicleId}
                            </option>
                        </template>
                    </select> -->
                </template>

                <template if:true={isReverseShipmentAction}>
                    
                    <!-- Delivery 
                    <label class="slds-form-element__label" for="delivery">
                        <abbr class="slds-required" title="required">*</abbr>{labels.select_delivery}
                    </label>
                    <select class="slds-select" id="delivery" data-name="delivery" name="delivery"
                        onchange={handleOnChange}>
                        <template for:each={deliveries} for:item="delivery" for:index="index">
                            <option key={delivery.Id} value={delivery.Id}>{delivery.ShipmentNumber}
                            </option>
                        </template>
                    </select>-->

                    <!--
                        Fields derived from Delivery
                        First Date
                    -->

                    <!-- Product -->
                    <lightning-input type="text" id="product" disabled="true" label={customLabels.PMC_SS_Product_FieldLabel} value={productName}></lightning-input>

                    <!-- Tons -->
                    <template if:true={deliveryQty}>
                        <lightning-input type="text" id="tonsQty" disabled="true" label={customLabels.PMC_SS_Tons_FieldLabel} value={deliveryQty}></lightning-input>
                    </template>

                    <!-- UOM -->
                    <template if:true={deliveryUoM}>
                        <lightning-input type="text" id="uom" disabled="true" label={customLabels.PMC_SS_UOM_FieldLabel} value={deliveryUoM}></lightning-input>
                    </template>

                    <!-- Ship From -->
                    <template if:true={objDelivery.ShipFrom}>
                        <lightning-input type="text" id="shipFrom" disabled="true" label={customLabels.PMC_SS_ShipFrom_FieldLabel} value={objDelivery.ShipFrom}></lightning-input>
                    </template>

                    <!-- Ship To -->
                    <template if:true={objDelivery.ShipTo}>
                        <lightning-input type="text" id="shipTo" disabled="true" label={customLabels.PMC_SS_ShipTo_FieldLabel} value={objDelivery.ShipTo}></lightning-input>
                    </template>

                    <!-- Shipment Date -->
                    <template if:true={objDelivery.ShippedDate}>
                        <lightning-input type="text" id="shipmentDate" disabled="true" label={customLabels.PMC_SS_ShipmentDate_FieldLabel} value={objDelivery.ShippedDate}></lightning-input>
                    </template>

                </template>

                <!-- Invoices -->
                <template if:true={invoices}>
                    <!-- <label class="slds-form-element__label" for="invoice"> -->
                        <!--abbr class="slds-required" title="required">*</abbr-->
                        <!-- {labels.select_invoice} -->
                    <!-- </label> -->
                    <!-- <select class="slds-select" id="invoice" data-name="invoice" name="invoice"
                        onchange={handleOnChange}>
                        <template for:each={invoices} for:item="invoice">
                            <option key={invoice.Id} value={invoice.Id}> {invoice.Name}</option>
                        </template>
                    </select> -->
                    <div class="slds-form-element">
                        <div class="slds-form-element__label" style="display: flex; align-items: center;">
                            <label for="custom-invoice-combobox" style="margin-right: 0.5rem;">{labels.select_invoice}</label>
                            <!-- <lightning-button-icon
                                icon-name="utility:search"
                                alternative-text="Search"
                                size="small"
                                variant="bare"
                                onclick={openSearchModal}
                                title="Search Invoice">
                            </lightning-button-icon> -->
                        </div>
                        <!-- <label class="slds-form-element__label" for="custom-invoice-combobox">Invoice</label> -->
                        <div class="slds-form-element__control">
                            <div class="slds-combobox_container">
                                <div class={dropdownClass} role="combobox" aria-expanded={isDropdownOpen} aria-haspopup="listbox">
                                    <!-- Selected value display -->
                                   

                                    <!-- <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                        <input
                                            type="text"
                                            class="slds-input slds-combobox__input slds-combobox__input-value"
                                            id="custom-invoice-combobox"
                                            aria-controls="invoice-listbox"
                                            role="textbox"
                                            readonly
                                            style="outline: none;" 
                                            value={selectedInvoiceLabel}
                                            onclick={toggleDropdown}
                                            placeholder="--- Select ---"
                                        />
                                        <span class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right">
                                            <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                                        </span>
                                            
                                    </div> -->
                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                        <lightning-input disabled={disabled} class="inputBox" placeholder="Select an Option"  onclick={toggleDropdown} onkeyup={filterOptions} value={selectedInvoiceLabel} auto-complete="off" variant="label-hidden" id="combobox-id-1" ></lightning-input>
                                        
                                        <!-- <div class="slds-input__icon slds-input__icon_right slds-icon_container" onclick={openSearchModal} style="cursor: pointer;">
                                            <lightning-icon class="slds-input__icon" icon-name="utility:search" size="x-small" alternative-text="search" ></lightning-icon>
                                        </div> -->
                                        <button class="slds-button slds-input__icon slds-input__icon_right" onclick={openSearchModal} style="position: absolute; right: 0.5rem;">
                                            <lightning-icon
                                                icon-name="utility:search"
                                                size="x-small"
                                                alternative-text="Search">
                                            </lightning-icon>
                                        </button>

                                    </div>
            
                                    <!-- Dropdown list -->
                                    <template if:true={isDropdownOpen}>
                                        <div id="invoice-listbox" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                <template for:each={inputfilteredInvoices} for:item="invoice">
                                                    <li key={invoice.Id} class="slds-listbox__item" role="presentation" data-id={invoice.Id} onclick={handleInvoiceSelect}>
                                                        <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option">
                                                             <span class="slds-media__figure slds-listbox__option-icon">
                                                                <lightning-icon
                                                                    icon-name="doctype:gdoc"
                                                                    size="x-small"
                                                                    alternative-text="Invoice"
                                                                    class="slds-icon slds-icon_x-small slds-icon-text-default">
                                                                </lightning-icon>
                                                            </span>
                                                            <span class="slds-media__body">
                                                                <div class="slds-truncate"><strong>{invoice.Name}</strong></div>
                                                                <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                    {invoice.PMC_CPQ_InvoiceNumber__c}
                                                                </div>
                                                            
                                                                <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                    {invoice.PMC_CPQ_Status__c}
                                                                </div>
                                                            
                                                                <div class="slds-truncate slds-text-color_weak" style="display: block;">
                                                                    {invoice.PMC_CPQ_DateIssued__c}
                                                                </div>
                                                            </span>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Original Invoice Amount -->
                    <lightning-input type="number" step=".01" formatter="currency" id="originalInvoiceAmount"
                        name="originalInvoiceAmount" label={customLabels.PMC_SS_OriginalInvoiceAmount_FieldLabel} disabled="true"
                        value={originalInvoiceAmt}></lightning-input>
                </template>
                
                <template if:true={isSearchModalOpen}>
                    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <lightning-icon icon-name="utility:search" size="small" class="slds-m-right_small" alternative-text="Search" title="Search"></lightning-icon>
                                <h2 class="slds-modal__title slds-hyphenate">Search Invoices</h2>
                            </header>

                            <div class="slds-modal__content slds-p-around_medium modalHeight">
                                <lightning-input label="Search by Name or Number" value={invoiceSearchKey} onchange={handleSearchKeyChange}></lightning-input>
                                
                                <template if:true={filteredInvoices}>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered  slds-table_striped slds-table_fixed-layout slds-m-top_medium">
                                        <thead>
                                            <tr>
                                                <th>Select</th>
                                                <th>Invoice Name</th>
                                                <th>Invoice Number</th>
                                                <th>Status</th>
                                                <th>Date</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={filteredInvoices} for:item="inv">
                                                <tr key={inv.Id}>
                                                    <td>
                                                        <input
                                                            type="radio"
                                                            name="invoiceSelection"
                                                            data-id={inv.Id}
                                                            checked={inv.isSelected}
                                                            onchange={handleCheckboxChange} />
                                                    </td>
                                                    <td>{inv.Name}</td>
                                                    <td>{inv.PMC_CPQ_InvoiceNumber__c}</td>
                                                    <td>{inv.PMC_CPQ_Status__c}</td>
                                                    <td>{inv.Invoice_Date__c}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>

                                <template if:false={invoices}>
                                    <p class="slds-text-color_weak slds-p-top_medium">No invoices found.</p>
                                </template>
                            </div>

                            <footer class="slds-modal__footer">
                                <lightning-button variant="neutral" label="Close" onclick={closeSearchModal}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>

                <template if:true={isCancelRebillReverseShipmentAction}>

                    <!-- Cancel / Rebill -->
                    <template if:true={isCancelRebillAction}>
                        <!-- Cancel Amount -->
                        <template if:true={cancelSelected}>
                            <lightning-input type="number" step=".01" formatter="currency" id="cancelAmount" name="cancelAmount"
                                label={customLabels.PMC_SS_CancelAmount_FieldLabel} required="true" onchange={handleOnChange}></lightning-input>
                        </template>
                    
                        <!-- Rebill Amount -->
                        <template if:true={rebillSelected}>
                            <lightning-input type="number" step=".01" formatter="currency" id="rebillAmount" name="rebillAmount"
                                label={customLabels.PMC_SS_RebillAmount_FieldLabel} required="true" onchange={handleOnChange}></lightning-input>
                        </template>                    
                    </template>


                    <template if:true={isReverseShipmentAction}>
                        <lightning-input type="number" step=".01" formatter="currency" id="dollarAmount" name="dollarAmount"
                        label={customLabels.PMC_SS_DollarAmount_FieldLabel} required="true" onchange={handleOnChange}></lightning-input>
                    </template>

                    <!-- Invoice Difference -->
                    <lightning-input type="number" step=".01" formatter="currency" id="invoiceDifference" name="invoiceDifference"
                    disabled="true" label={customLabels.PMC_SS_InvoiceDifference_FieldLabel} value={invoiceDifference}></lightning-input>

                    <template if:true={objOrderDetailsWrapper.objAccountWrapper}>
                        <!-- Account -->
                        <lightning-input label={customLabels.PMC_SS_Account_FieldLabel} name="" id="account" disabled="true"
                            value={objOrderDetailsWrapper.objAccountWrapper.strRecordName}></lightning-input>
                    </template>
                    <!--GHOS-2258
                    <template if:true={objContact.Name}>
                        
                        <lightning-input label={customLabels.PMC_SS_Contact_FieldLabel} name="" id="contact" disabled="true"
                            value={objContact.Name}></lightning-input>
                    </template>
-->
                </template>


                <template if:true={isCreditDebitReturnAction}>

                    <!-- Credit / Debit -->
                    <template if:true={isCreditDebitAction}>
                        <lightning-input type="number" step=".01" formatter="currency" id="creditDebitAmount"
                            name="creditDebitAmount" label={customLabels.PMC_SS_CreditDebitAmount_FieldLabel} required="true" onchange={handleOnChange}></lightning-input>
                    </template>

                    <!-- Return -->
                    <template if:true={isReturnAction}>
                        <!-- Return Quantity -->
                        <lightning-input label={customLabels.PMC_SS_ReturnQuantity_FieldLabel} name="returnQuantity" id="returnQuantity" type="number" step=".01"
                            required="true" onchange={handleOnChange}></lightning-input>

                        <!-- Return Amount -->
                        <lightning-input type="number" step=".01" formatter="currency" id="returnAmount" disabled="true"
                            label={customLabels.PMC_SS_ReturnAmount_FieldLabel} value={returnAmount}></lightning-input>
                    </template>

                    <template if:true={shipToAccountName}>
                        <!-- Ship-To Account -->
                        <lightning-input label={customLabels.PMC_SS_ShipToAccount_FieldLabel} name="" id="shipToAccount" disabled="true"
                            value={shipToAccountName}></lightning-input>
                    </template>

                    <template if:true={objOrderDetailsWrapper.objSoldToAccountWrapper}>
                        <!-- Sold-To Account -->
                        <lightning-input label={customLabels.PMC_SS_SoldToAccount_FieldLabel} name="" id="soldToAccount" disabled="true"
                            value={objOrderDetailsWrapper.objSoldToAccountWrapper.strRecordName}></lightning-input>
                    </template>

                    <template if:true={plantId}>
                        <!-- Plant -->
                        <lightning-input label={customLabels.PMC_SS_Plant_FieldLabel} name="" id="plant" type="text" disabled="true"
                            value={plantId}></lightning-input>
                    </template>

                    <template if:true={isReturnAction}>
                        <template if:true={modeOfTransportation}>
                            <!-- Mode Of Transportation -->
                            <lightning-input label={customLabels.PMC_SS_ModeOfTransportation_FieldLabel} name="" id="modeOfTransportation"
                                type="text" disabled="true" value={modeOfTransportation}></lightning-input>
                        </template>                        
                    </template>
                </template>

                <template if:true={isReturnReverseShipmentAction}>
                        <!-- PGI Date -->
                        <template if:true={pgiDate}>
                            <lightning-input label={customLabels.PMC_SS_PGIDate_FieldLabel} name="pgiDate" id="pgiDate" disabled="true"
                                value={pgiDate}></lightning-input>
                        </template>
                </template>

                <!-- Add Details Comment Box, File Upload - Reverse Shipment -->
                <template if:true={isReverseShipmentAction}>
                    <lightning-textarea id="comments" data-id="comments" data-name="comments" label={customLabels.PMC_SS_Comments_FieldLabel} max-length="255" onchange={handleOnChange}></lightning-textarea>
                    <c-pmc_ss_custom-File-Uploader title={labels.uploadDoc} recordid={recordId} onfileuploaded={fileUploaded}></c-pmc_ss_custom-File-Uploader>
                </template>

                <!-- At Fault Party -->
                <label class="slds-form-element__label" for="atFaultParty">
                    <abbr class="slds-required" title="required">*</abbr>{labels.select_atFaultParty}
                </label>
                <select class="slds-select" id="atFaultParty" name="atFaultParty" data-name="atFaultParty" 
                    onchange={handleOnChange} >
                    <template for:each={atFaultParty} for:item="option">
                        <!-- GSMD-2757 -->
                        <option key={option.label} class="uiInputSelectOption" selected={option.selected}>{option.label}
                        </option>
                    </template>
                </select>

                <!--GSMD-4070 - Mode of Transportation -->
                <template if:true={showMOT}>
                    <label class="slds-form-element__label" for="modeofTransportation">
                        <abbr class="slds-required" title="required">*</abbr>{labels.select_modeofTransportation}
                    </label>
                    <select class="slds-select" id="modeofTransportation" name="modeofTransportation" data-name="modeofTransportation"
                        onchange={handleOnChange}>
                        <template for:each={modeofTransportation} for:item="option">
                            <option key={option.label} class="uiInputSelectOption" value={option.value}>{option.label}
                            </option>
                        </template>
                    </select>
                </template>

               <!-- added Location for GSMD-4076 -->
               <!-- Location -->
               <template if:true={showLocation}>
                   <label class="slds-form-element__label" for="location">
                     <abbr class="slds-required" title="required">*</abbr>{labels.select_location}
                    </label>
                 <c-pmc_location-lookup
       onlocationselected={handleLocationSelected}>
</c-pmc_location-lookup>
               </template>
             
                <div class="footer">
                    <lightning-button variant="neutral" label={customLabels.PMC_SS_SNOW_Cancel_Label} onclick={closeAction}></lightning-button> &nbsp;
                    &nbsp;
                    &nbsp;
                    <lightning-button variant="brand" label={customLabels.PMC_SS_SNOW_Save_Label} onclick={saveAction}></lightning-button>
                </div>

            </div>
        </lightning-card>
    </lightning-quick-action-panel>
</template>
