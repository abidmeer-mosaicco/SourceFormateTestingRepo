<template>
  <template lwc:if={pageLoaded}>
    <template if:true={isOrderDetailView}>
      <c-pmc_dh_breadcrumb crumbs={crumbs}></c-pmc_dh_breadcrumb>
      <h3 class="slds-m-bottom_large slds-m-top_medium">
        {orderDetailsPageTitle}
      </h3>
      <div class="slds-m-bottom--large">
        <c-pmc_dh_progress-bar-tracker steps={steps} is-stepper-text={isStepperText}></c-pmc_dh_progress-bar-tracker>
      </div>
      <div class="message-container">
        <div class="info-message">
          <img src={iconUrlObj.infoIconUrl} alt="More Information" />
          <span class="dxp-text-body">
            {orderDetailsMessageBanner}&nbsp;
            <a onclick={openCreateCaseModal}>{labels.pmc_orderDetails_getInTouchMsg}</a>
          </span>
        </div>
      </div>
      <template if:true={isCreateCaseEnabled}>
        <c-pmc_dh_create-case is-create-case-enabled={isCreateCaseEnabled} order-number={orderNum}
          onclosecreatecasepopup={closeCreateCaseModal}></c-pmc_dh_create-case>
      </template>
      <div class="scrollable-container" tabindex="0">
        <div class="scrollable-content">
          <div class="slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-1 order-summary-section">
              <div class="custom-card order-summary">
                <div class="card-header">{labels.pmc_orderDetails_summary}</div>
                <div class="card-body">
                  <div class="slds-grid">
                    <template lwc:if={getStrCustomerName}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_quoteDetailsFlow_customerName}
                        </div>
                        <div class="lbl-field-value">
                          {orderDetails.orderSummaryWrapper.strCustomerName}
                        </div>
                      </div>
                    </template>

                    <template lwc:if={getStrOrderPlacedBy}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_orderDetails_orderPlacedBy}
                        </div>
                        <div class="lbl-field-value">
                          {orderDetails.orderSummaryWrapper.strOrderPlacedBy}
                        </div>
                      </div>
                    </template>
                    <template lwc:if={getStrRequestIds}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_orderHistory_requestId}
                        </div>
                        <div class="lbl-field-value">
                          {strLstRequestIds}
                        </div>
                      </div>
                    </template>
                    <template lwc:if={getStrProtocolNo}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_orderHistory_protocolId}
                        </div>
                        <div class="lbl-field-value">
                          {orderDetails.orderSummaryWrapper.strProtocolNo}
                        </div>
                      </div>
                    </template>
                    <template lwc:if={getStrSalesChannel}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_orderDetails_salesChannel}
                        </div>
                        <div class="lbl-field-value">
                          {orderDetails.orderSummaryWrapper.strSalesChannel}
                        </div>
                      </div>
                    </template>

                    <template lwc:if={getDatDatePlaced}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 content-info">
                        <div class="lbl-field-name">
                          {labels.pmc_orderDetails_datePlaced}
                        </div>
                        <div class="lbl-field-value">
                          {orderDetails.orderSummaryWrapper.datDatePlaced}
                        </div>
                      </div>
                    </template>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-7 badge-info slds-col_bump-right">
                      <div class="lbl-field-name hidden-sm">
                        {labels.pmc_userManagement_userStatus}
                      </div>
                      <div class="lbl-field-value slds-size_1-of-1">
                        <span class="badge badge-font"
                          data-status={orderDetails.orderSummaryWrapper.strSummaryBadgeStatus}>
                          {orderDetails.orderSummaryWrapper.strSummaryStatus}
                        </span>
                      </div>
                    </div>
                    <template if:false={isOrderStatusRequested}>
                      <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-7 order-summary-btn-section">
                        <template if:true={callPriceObj.isCallPriceBtn}>
                          <div class="mobile-button btn-style">
                            <lightning-button variant="brand" label={callPriceObj.btnLabel}
                              onclick={openCallPriceModalHandler} disabled={callPriceObj.isBtnDisabled}>
                            </lightning-button>
                          </div>
                        </template>
                        <div class="mobile-button btn-style">
                          <template if:false={isReorderDisabled}>
                            <lightning-button label={labels.pmc_orderDetails_reorder} onclick={openReorderModalHandler}>
                            </lightning-button>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="slds-grid slds-gutters slds-wrap">

            <template if:true={isOrderStatusRequested}>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12 slds-p-around--none">
                <div class="slds-grid slds-wrap">
                  <div class="slds-col slds-size_1-of-1">
                    <div class="custom-card productInfo-card">
                      <div class="card-header">
                        {labels.pmc_requestForQuote_productsInformation}
                      </div>
                      <div class="card-body">
                        <div class="product-info-section" for:each={orderDetails.productInfoWrapper} for:item="product"
                          for:index="indexProduct" key={product.strProductId}>
                          <div class="slds-grid slds-wrap product-img">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6 content-info">
                              <div class="product-col">
                                <div class="product-image slds-m-right--medium slds-m-left_xx-small">
                                  <template lwc:if={isProductRedirected}>
                                    <img onerror={handleImageError} src={product.strImgSrc}
                                      alt={product.strProductName} />
                                  </template>
                                  <template lwc:else>
                                    <a href={product.pdpUrl} target="_self">
                                      <img onerror={handleImageError} src={product.strImgSrc}
                                        alt={product.strProductName} />
                                    </a>
                                  </template>
                                </div>
                                <div class="product-info">
                                  <div class="slds-m-bottom_xx-small product-name">
                                    <template lwc:if={isProductRedirected}>
                                      {product.strProductName}
                                    </template>
                                    <template lwc:else>
                                      <a href={product.pdpUrl} target="_self">
                                        {product.strProductName}
                                      </a>
                                    </template>
                                  </div>
                                  <div class="">
                                    {labels.pmc_cartCheckout_sku}&nbsp;{product.strSku}
                                  </div>
                                </div>
                              </div>
                            </div>
                            <template if:true={isLocationBrazil}>
                              <div
                                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                                <div class="lbl-field-name">
                                  {labels.pmc_orderDetails_itemNumber}
                                </div>
                                <div class="lbl-field-value">
                                  {product.strItemNumber}
                                </div>
                              </div>
                            </template>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_orderDetails_requestedQty}
                              </div>
                              <div class="lbl-field-value">
                                {product.intRequestedQty}
                              </div>
                            </div>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_orderDetails_confirmedQty}
                              </div>
                              <div class="lbl-field-value">
                                <template lwc:if={isLocationBrazil}>
                                  {product.intConfirmedQty}
                                </template>
                                <template lwc:else>
                                  {labels.pmc_quoteDetailsFlow_statusNotApplicable}
                                </template>
                              </div>
                            </div>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_requestForQuote_unitOfMeasure}
                              </div>
                              <template lwc:if={isLocationBrazil}>
                                <div class="lbl-field-value">
                                  {product.strProductUOM}
                                </div>
                              </template>
                              <template lwc:else>
                                <div class="lbl-field-value">
                                  {product.strProductUOMLabel}
                                </div>
                              </template>
                            </div>
                          </div>
                          <div class="slds-p-horizontal_medium">
                            <div class="scrollable-wrapper-table" tabindex="0">
                              <table class="slds-table slds-m-vertical_medium">
                                <thead>
                                  <tr class="slds-line-height_reset">
                                    <template if:true={isLocationBrazil}>
                                      <th scope="col">
                                        <div title={labels.pmc_orderHistory_protocolId}>
                                          {labels.pmc_orderHistory_protocolId}
                                        </div>
                                      </th>
                                      <th scope="col">
                                        <div title={labels.pmc_orderHistory_salesOrder}>
                                          {labels.pmc_orderHistory_salesOrder}
                                        </div>
                                      </th>
                                    </template>
                                    <th scope="col">
                                      <div title={labels.pmc_requestToDeliver_expectedShipmentDate}>
                                        {labels.pmc_requestToDeliver_expectedShipmentDate}
                                      </div>
                                    </th>
                                    <th scope="col">
                                      <div title={labels.pmc_orderDetails_requestedQty}>
                                        {labels.pmc_orderDetails_requestedQty}
                                      </div>
                                    </th>
                                    <th scope="col">
                                      <div title={labels.pmc_quoteCheckoutFlow_deliveryMode}>
                                        {labels.pmc_quoteCheckoutFlow_deliveryMode}
                                      </div>
                                    </th>
                                    <th scope="col" class="shipping-info">
                                      <div title={labels.pmc_quoteCheckoutFlow_shipTo}>
                                        {labels.pmc_quoteCheckoutFlow_shipTo}
                                      </div>
                                    </th>
                                    <th scope="col" class="shipping-info">
                                      <div title={labels.pmc_quoteCheckoutFlow_shipFrom}>
                                        {labels.pmc_quoteCheckoutFlow_shipFrom}
                                      </div>
                                    </th>
                                    <template if:true={isLocationBrazil}>
                                      <th scope="col">
                                        <div title={labels.pmc_requestForQuote_packType}>
                                          {labels.pmc_requestForQuote_packType}
                                        </div>
                                      </th>
                                      <template if:true={isPackageFieldVisible}>
                                        <th scope="col">
                                          <div title={labels.pmc_requestForQuote_packagingType}>
                                            {labels.pmc_requestForQuote_packagingType}
                                          </div>
                                        </th>
                                      </template>
                                    </template>
                                    <template if:true={isEditDateAndQuantityAllowed}>
                                      <th scope="col">
                                        <div title={labels.pmc_userDetails_edit}></div>
                                      </th>
                                    </template>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template for:each={product.lstShipmentItems} for:item="shipment"
                                    for:index="indexShipment">
                                    <template for:each={shipment.lstShipmentPlan} for:item="plan" for:index="indexPlan">
                                      <tr class="" key={plan.strOrderItemId}>
                                        <template if:true={isLocationBrazil}>
                                          <td scope="row" class="wrap-text">
                                            {plan.strProtocolNo}
                                          </td>
                                          <td scope="row" class="wrap-text">
                                            {plan.strSalesOrder}
                                          </td>
                                        </template>
                                        <template if:false={isEditDateAndQuantityAllowed}>
                                          <td scope="row" class="wrap-text">
                                            {plan.strFormattedRequestedShipmentDate}
                                          </td>
                                          <td scope="row" class="wrap-text">
                                            {plan.intRequestedQty}
                                          </td>
                                        </template>
                                        <template if:true={isEditDateAndQuantityAllowed}>
                                          <td scope="row" class="wrap-text requested-shipment-date">
                                            <c-pmc_dh_input-element text-label="Req. Shipment Date" type="date"
                                              data-id="strRequestedShipmentDate"
                                              default-value={plan.strRequestedShipmentDate}
                                              data-product-index={indexProduct} data-shipment-index={indexShipment}
                                              data-plan-index={indexPlan} parent-name="strRequestedShipmentDate"
                                              min-value={minRequestedShipmentDate} 
                                              is-disabled={plan.isEditDateAndQuantityDisabled} is-required
                                              oninputdatachange={handleDataChange}>
                                            </c-pmc_dh_input-element>
                                          </td>
                                          <td scope="row" class="wrap-text quantity-input-field">
                                            <c-pmc_dh_input-element data-id="intRequestedQty"
                                              text-label={labels.pmc_orderDetails_requestedQty}
                                              parent-name="intRequestedQty" default-value={plan.intRequestedQty}
                                              data-value={plan.intRequestedQty} data-product-index={indexProduct}
                                              data-shipment-index={indexShipment} data-plan-index={indexPlan}
                                              is-required max-length={qtyMaxLength} pattern={qtyPattern}
                                              is-disabled={plan.isEditDateAndQuantityDisabled}
                                              oninputdatachange={handleDataChange} oninputdatablur={handleBlur}
                                              onkeypress={handleOnKeyPress}>
                                            </c-pmc_dh_input-element>
                                          </td>
                                        </template>
                                        <template lwc:if={isLocationBrazil}>
                                          <td scope="row" class="wrap-text">
                                            {shipment.strDeliveryMode}
                                          </td>
                                        </template>
                                        <template lwc:else>
                                          <td scope="row" class="wrap-text">
                                            {shipment.strDeliveryModeLabel}
                                          </td>
                                        </template>
                                        <td scope="row" class="wrap-text">
                                          {shipment.wrpShipTo.label}
                                        </td>
                                        <td scope="row" class="wrap-text">
                                          {shipment.wrpShipFrom.label}
                                        </td>
                                        <template if:true={isLocationBrazil}>
                                          <td scope="row" class="wrap-text">
                                            {plan.strPackType}
                                          </td>
                                          <template if:true={isPackageFieldVisible}>
                                            <td scope="row" class="wrap-text">
                                              {plan.strPackageType}
                                            </td>
                                          </template>
                                        </template>
                                        <template if:true={isEditDateAndQuantityAllowed}>
                                          <td data-label={labels.pmc_userDetails_edit} class="slds-p-top--none">
                                            <div
                                              class="slds-col slds-size_1-of-1 slds-align_absolute-center slds-p-right--none edit-icon-style">
                                              <template if:true={plan.isEditDateAndQuantityDisabled}>
                                                <template if:false={plan.isEditDisabled}>
                                                  <lightning-button-icon icon-name="utility:edit"
                                                    alternative-text={labels.pmc_userDetails_edit}
                                                    title={labels.pmc_userDetails_edit}
                                                    data-product-index={indexProduct}
                                                    data-shipment-index={indexShipment} data-plan-index={indexPlan}
                                                    onclick={handleEditInfo}>
                                                  </lightning-button-icon>
                                                </template>
                                              </template>
                                              <template if:false={plan.isEditDateAndQuantityDisabled}>
                                                <lightning-button-icon icon-name="utility:close"
                                                  alternative-text={labels.pmc_miniCartModal_closeLabel}
                                                  title={labels.pmc_miniCartModal_closeLabel}
                                                  data-product-index={indexProduct} data-shipment-index={indexShipment}
                                                  data-plan-index={indexPlan} onclick={handleCloseEdit}>
                                                </lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:check"
                                                  alternative-text={labels.pmc_quoteDetailsFlow_check}
                                                  title={labels.pmc_quoteDetailsFlow_check}
                                                  disabled={plan.isSaveFieldsBtnDisabled}
                                                  data-product-index={indexProduct} data-shipment-index={indexShipment}
                                                  data-plan-index={indexPlan} onclick={handleSaveEditInfo}
                                                  class="save-icon-style">
                                                </lightning-button-icon>
                                              </template>
                                            </div>
                                          </td>
                                        </template>
                                      </tr>
                                      <tr key={plan.strOrderItemId} class="shipment-error-section">
                                        <td colspan="5">
                                          <template if:true={plan.isRequestedShipmentDateError}>
                                            <div class="shipment-error-msg">
                                              <template lwc:if={isContractNotAvail}>
                                                {labels.pmc_orderDetails_dateValidationErrMsg}
                                              </template>
                                              <template lwc:else>
                                                {labels.pmc_orderDetails_validityPeriodErrorMsg}
                                              </template>
                                              <template lwc:if={plan.isValidityWarning}>
                                                <div class="shipment-error-msg">
                                                  {labels.pmc_orderDetails_validityPeriodErrorMsg}
                                                </div>
                                              </template>
                                            </div>
                                          </template>
                                          <template if:true={plan.isAvailableQuantityError}>
                                            <div class="shipment-error-msg">
                                              {labels.pmc_orderDetails_requestedQtyErrorMsg}
                                            </div>
                                          </template>
                                        </td>
                                      </tr>
                                    </template>
                                  </template>
                                  <template if:true={product.isDuplicateShippingInfo}>
                                    <tr class="duplicate-error-section">
                                      <td colspan="5">
                                        <div class="shipment-error-msg slds-m-top_xx-small">
                                          {labels.pmc_orderDetails_duplicateShipmentErrorMsg}
                                        </div>
                                      </td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
            <template if:false={isOrderStatusRequested}>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12 slds-p-around--none">
                <div class="slds-grid slds-wrap">
                  <div class="slds-col slds-size_1-of-1">
                    <div class="custom-card productInfo-card">
                      <div class="card-header">
                        {labels.pmc_requestForQuote_productsInformation}
                      </div>
                      <div class="card-body">
                        <div class="product-info-section" for:each={orderDetails.productInfoWrapper} for:item="product"
                          for:index="indexProduct" key={product.strProductId}>
                          <div class="slds-grid slds-wrap product-img">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6 content-info">
                              <div class="product-col">
                                <div class="product-image slds-m-right--medium slds-m-left_xx-small">
                                  <template lwc:if={isProductRedirected}>
                                    <img onerror={handleImageError} src={product.strImgSrc}
                                      alt={product.strProductName} />
                                  </template>
                                  <template lwc:else>
                                    <a href={product.pdpUrl} target="_self">
                                      <img onerror={handleImageError} src={product.strImgSrc}
                                        alt={product.strProductName} />
                                    </a>
                                  </template>
                                </div>
                                <div class="product-info">
                                  <div class="slds-m-bottom_xx-small product-name">
                                    <template lwc:if={isProductRedirected}>
                                      {product.strProductName}
                                    </template>
                                    <template lwc:else>
                                      <a href={product.pdpUrl} target="_self">
                                        {product.strProductName}
                                      </a>
                                    </template>
                                  </div>
                                  <div class="">
                                    {labels.pmc_cartCheckout_sku}&nbsp;{product.strSku}
                                  </div>
                                </div>
                              </div>
                            </div>
                            <template if:true={isLocationBrazil}>
                              <div
                                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                                <div class="lbl-field-name">
                                  {labels.pmc_orderDetails_itemNumber}
                                </div>
                                <div class="lbl-field-value">
                                  {product.strItemNumber}
                                </div>
                              </div>
                            </template>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_orderDetails_requestedQty}
                              </div>
                              <div class="lbl-field-value">
                                {product.intRequestedQty}
                              </div>
                            </div>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_orderDetails_confirmedQty}
                              </div>
                              <template if:true={isOrderStatusRequested}>
                                <div class="lbl-field-value">
                                  {labels.pmc_quoteDetailsFlow_statusNotApplicable}
                                </div>
                              </template>
                              <template if:false={isOrderStatusRequested}>
                                <div class="lbl-field-value">
                                  {product.intConfirmedQty}
                                </div>
                              </template>
                            </div>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 content-info product-info-col">
                              <div class="lbl-field-name">
                                {labels.pmc_requestForQuote_unitOfMeasure}
                              </div>
                              <div class="lbl-field-value">
                                {product.strProductUOMLabel}
                              </div>
                            </div>
                          </div>
                          <div class="slds-p-horizontal_medium">
                            <div class="scrollable-wrapper-table" tabindex="0">
                              <div class="ship-info-header">
                                <p>{labels.pmc_orderDetails_shipmentInformation}</p>
                              </div>
                              <template for:each={product.lstShipmentItems} for:item="shipment">
                                <div class="shipment-information-section slds-p-top--medium"
                                  key={shipment.strOrderItemId}>
                                  <div class="slds-grid slds-p-bottom--small">
                                    <div class="slds-col slds-size_1-of-8 shipment-info">
                                      <div class="lbl-field-name">
                                        {labels.pmc_orderDetails_requestedQty}
                                      </div>
                                      <div class="lbl-field-value">
                                        {shipment.intRequestedQty}
                                      </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-8 shipment-info">
                                      <div class="lbl-field-name">
                                        {labels.pmc_quoteCheckoutFlow_deliveryMode}
                                      </div>
                                      <div class="lbl-field-value">
                                        {shipment.strDeliveryModeLabel}
                                      </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-8 shipment-info">
                                      <div class="lbl-field-name">
                                        {labels.pmc_quoteCheckoutFlow_shipTo}
                                      </div>
                                      <div class="lbl-field-value">
                                        {shipment.wrpShipTo.label}
                                      </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-8 shipment-info">
                                      <div class="lbl-field-name">
                                        {labels.pmc_quoteCheckoutFlow_shipFrom}
                                      </div>
                                      <div class="lbl-field-value">
                                        {shipment.wrpShipFrom.label}
                                      </div>
                                    </div>
                                    <template if:true={isLocationBrazil}>
                                      <div class="slds-col slds-size_1-of-8 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_requestForQuote_packType}
                                        </div>
                                        <div class="lbl-field-value">
                                          {shipment.strPackTypeLabel}
                                        </div>
                                      </div>
                                      <template if:true={isPackageFieldVisible}>
                                        <div class="slds-col slds-size_1-of-8 shipment-info">
                                          <div class="lbl-field-name">
                                            {labels.pmc_requestForQuote_packagingType}
                                          </div>
                                          <div class="lbl-field-value">
                                            {shipment.strPackageTypeLabel}
                                          </div>
                                        </div>
                                      </template>
                                    </template>
                                  </div>
                                  <div class="grouping-section slds-p-bottom--small">
                                    <div class="slds-grid">
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_orderDetails_grouping}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.PMC_CPQ_SAPOrderLineID}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_requestToDeliver_expectedShipmentDate}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_orderDetails_pendingQty}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_orderDetails_shippedQty}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_orderDetails_deliveredQty}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-name">
                                          {labels.pmc_addresses_status}
                                        </div>
                                      </div>
                                      <template if:true={callPriceObj.isCallPrice}>
                                        <div class="slds-col slds-size_1-of-8 shipment-info">
                                          <div class="lbl-field-name">
                                            {labels.pmc_fpd_callPriceDate}
                                          </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-8 shipment-info">
                                          <div class="lbl-field-name">
                                            {labels.pmc_addresses_status}
                                          </div>
                                        </div>
                                      </template>
                                    </div>
                                    <div class="slds-grid" for:each={shipment.lstOrderLines} for:item="plan"
                                      for:index="indx" key={plan.strOrderItemId}>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div>
                                          <span class="lbl-field-value order-line" data-id={plan.strOrderItemId}
                                            onclick={navigateToOrderLineDetails}>{labels.pmc_shipmentDetails_orderLineNumber}
                                            #{plan.strOrderItemNumber}</span>
                                        </div>
                                      </div>
                                      <!--  GSMD-1867-->
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          {plan.strSapOrderLine}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          {plan.datRequestedShipmentDate}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          {plan.strPendingQuantity}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          {plan.strShippedQuantity}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          {plan.strDeliverQuantity}
                                        </div>
                                      </div>
                                      <div class="slds-col slds-size_1-of-7 shipment-info">
                                        <div class="lbl-field-value">
                                          <span class="badge badge-font order-line-badge"
                                            data-status={plan.strOrderLineBadgeStatus}>
                                            {plan.strDeliveryStatus}
                                          </span>
                                        </div>
                                      </div>
                                      <template if:true={callPriceObj.isCallPrice}>
                                        <div class="slds-col slds-size_1-of-8 shipment-info">
                                          <div class="lbl-field-value">
                                            {plan.formattedCallPriceDate}
                                          </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-8 shipment-info">
                                          <div class="lbl-field-value">
                                            <span class="badge badge-font" data-status={plan.callPriceBadgeStatus}>
                                              {plan.callPriceStatus}
                                            </span>
                                          </div>
                                        </div>
                                      </template>
                                    </div>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-p-around--none slds-m-bottom_mediun">
              <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1 contract-info-section">
                  <div class="custom-card contract-card">
                    <div class="card-header">
                      <div class="slds-grid slds-gutters contract-header">
                        <div class="slds-col">
                          {labels.pmc_requestToDeliver_contractInformation}
                        </div>
                        <template if:false={isContractHidden}>
                          <div class="slds-col contract-link">
                            <a role="link" aria-disabled={isContractNotAvail}
                              onclick={navigateToContractDetails}>{labels.pmc_contractMgmt_viewContract}</a>
                          </div>
                        </template>
                      </div>
                    </div>
                    <div class="card-body">
                      <div class="slds-grid slds-wrap contract-content">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 content-info">
                          <div class="lbl-field-name">
                            {labels.pmc_requestToDeliver_contractNumber}
                          </div>
                          <div class="lbl-field-value">
                            {orderDetails.contractInfoWrapper.strContractNumber}
                          </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 content-info">
                          <div class="lbl-field-name">
                            {labels.pmc_contractDetails_poNumber}
                          </div>
                          <div class="lbl-field-value">
                            {orderDetails.contractInfoWrapper.strPoNumber}
                          </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-4 content-info">
                          <div class="lbl-field-name">
                            {labels.pmc_contractDetails_validityPeriod}
                          </div>
                          <div class="lbl-field-value">
                            {orderDetails.contractInfoWrapper.validityPeriod}
                          </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 content-info">
                          <div class="lbl-field-name">
                            {labels.pmc_contractDetails_contractType}
                          </div>
                          <div class="lbl-field-value">
                            {orderDetails.contractInfoWrapper.strContractType}
                          </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 content-info">
                          <div class="lbl-field-name">
                            {labels.pmc_quoteCheckoutFlow_paymentTerms}
                          </div>
                          <div class="lbl-field-value">
                            {orderDetails.contractInfoWrapper.strPaymentTerms}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <template if:true={callPriceObj.isCallPrice}>
                  <div class="slds-col slds-size_1-of-1 called-price-summary-section">
                    <c-pmc_dh_order-called-price-summary
                      lst-called-price-summary-data={callPriceObj.calledPriceSummaryWrapper}>
                    </c-pmc_dh_order-called-price-summary>
                  </div>
                </template>

              </div>
            </div>
          </div>
        </div>
      </div>

      <c-pmc_dh_custom-requote-modal is-modal={isReorderModal} modal-heading={labels.pmc_orderDetails_reorderProducts}
        modal-text={labels.pmc_orderDetails_reorderText} onclosemodal={handleCloseReorderModal}
        onhandleproductaction={handleReorderProducts}>
      </c-pmc_dh_custom-requote-modal>

      <c-pmc_dh_custom-modal open-modal={isCallPriceModal} modal-heading={labels.pmc_fpd_callPrice} modal-width="1000px"
        onclosemodalevent={handleCloseCallPriceModal}>
        <div class="call-price-modal-wrapper">
          <div class="modal-message slds-m-bottom_small">
            {labels.pmc_fpd_requestCallPrice}
          </div>
          <c-pmc_dh_selection-picklist text-label="Product" combobox-list-json={callPriceObj.productList}
            data-id="strProduct" default-value={callPriceObj.selectedProduct} parent-name="strProduct"
            oninputdatachange={handleCallPriceProductChange}>
          </c-pmc_dh_selection-picklist>
          <template for:each={callPriceObj.modalData} for:item="product">
            <div key={product.id}>
              <template if:true={product.isSelected}>
                <fieldset class="slds-form-element">
                  <div class="slds-form-element__control">
                    <span class="slds-radio" for:each={product.radioBtnOptions} for:item="btn" key={btn.id}>
                      <input type="radio" id={btn.id} value={btn.id} data-id={btn.id} checked={btn.checked}
                        disabled={btn.disabled} onchange={handleCallPriceRadioOptionChange} />
                      <label class="slds-radio__label" for={btn.id}>
                        <span class="slds-radio_faux"></span>
                        <span class="slds-form-element__label">{btn.label}</span>
                      </label>
                    </span>
                  </div>
                </fieldset>
                <template if:true={product.isOrderLines}>
                  <div class="modal-message">
                    {labels.pmc_fpd_whichOrderLine}
                  </div>
                  <c-pmc_dh_custom-datatable columns={callPriceModalColumns} table-data={product.orderLinesData}
                    oncheckboxclick={handleCallPriceCheckboxChange}>
                  </c-pmc_dh_custom-datatable>
                </template>
              </template>
            </div>
          </template>
          <div class="button-section">
            <div class="mobile-button">
              <lightning-button variant="neutral" label={labels.pmc_addressDetails_cancel}
                title={labels.pmc_addressDetails_cancel} onclick={handleCloseCallPriceModal}>
              </lightning-button>
            </div>
            <div class="mobile-button">
              <lightning-button variant="brand" label={labels.pmc_fpd_callPriceNow} title={labels.pmc_fpd_callPriceNow}
                disabled={callPriceObj.isModalCTADisabled} onclick={callPriceNowHandler}>
              </lightning-button>
            </div>
          </div>
        </div>
      </c-pmc_dh_custom-modal>

    </template>
    <template if:true={isOrderLineDetailView}>
      <c-pmc_dh_order-line-details order-line-id={orderLineId} order-id={orderId} order-line-items={orderLineItems}
        order-number={orderDetails.strOrderNumber} onvieworderdetails={landToOrderDetailsView}
        show-call-price={callPriceObj.isCallPrice} show-call-price-btn={callPriceObj.isCallPriceBtn}
        onnavigatetodeliverytracking={navigateToDeliveryTracking}></c-pmc_dh_order-line-details>
    </template>
    <template if:true={isDeliveryTracking}>
      <c-pmc_dh_delivery-tracking order-line-num={selectedOrderLineNumber} order-line-id={orderLineId}
        order-id={orderId} order-number={orderDetails.strOrderNumber} onvieworderdetails={landToOrderDetailsView}
        vehicle-id={vehicleId}>
      </c-pmc_dh_delivery-tracking>
    </template>
  </template>

  <template if:true={isUnauthorizedAccess}>
    <c-pmc_dh_unauthorized-access-page
      message={labels.pmc_unauthorizedAccess_restrictedAccessText2}></c-pmc_dh_unauthorized-access-page>
  </template>

  <template lwc:if={isSpinner}>
    <c-pmc_dh_spinner is-spinner> </c-pmc_dh_spinner>
  </template>
</template>
