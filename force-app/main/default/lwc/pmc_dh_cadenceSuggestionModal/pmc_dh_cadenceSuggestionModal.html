<template>
  <c-pmc_dh_custom-modal open-modal modal-heading={modalTitle}
    modal-width="1000px" onclosemodalevent={closeModalHandler}>
    <div class="modal-wrapper">
      <div class="header-text slds-p-around_small">
        {headerText}
      </div>
      <template if:true={pageLoaded}>
        <div class="table-wrapper slds-p-horizontal_small">
          <table class="slds-table">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">
                  <div></div>
                </th>
                <th scope="col">
                  <div title={labels.pmc_homepage_product}>
                    {labels.pmc_homepage_product}
                  </div>
                </th>
                <th scope="col">
                  <div title={labels.pmc_quoteCheckoutFlow_deliveryInformation}>
                    {labels.pmc_quoteCheckoutFlow_deliveryInformation}
                  </div>
                </th>
                <th scope="col" class="shipping-info">
                  <div title={labels.pmc_quoteCheckoutFlow_shipTo}>
                    {labels.pmc_quoteCheckoutFlow_shipTo}
                  </div>
                </th>
                <th scope="col" class="shipping-info">
                  <div title={labels.pmc_quoteCheckoutFlow_shipFrom}>
                    {labels.pmc_quoteCheckoutFlow_shipFrom}
                  </div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={cadenceData} for:item="data" for:index="index">
                <tr key={index.index}>
                  <td scope="row">
                    <fieldset class="slds-form-element">
                      <div class="slds-form-element__control">
                        <span class="slds-radio">
                          <input type="radio" id={data.id} value={data.id} aria-label="quoteLineRadio" name="quoteLineRadio"
                            data-quote-line-id={data.strQuoteLineId} checked={data.isRadioBtnChecked}
                            onclick={handleClick} onchange={handleRadioOptionChange} />
                        </span>
                      </div>
                    </fieldset>
                  </td>
                  <td scope="row" class="wrap-text product-col">
                    {data.strProductName}
                  </td>
                  <td scope="row" class="wrap-text">
                    {data.strDeliveryInfo}
                  </td>
                  <td scope="row" class="wrap-text shipment-col">
                    {data.strShipTo}
                  </td>
                  <td scope="row" class="wrap-text shipment-col">
                    {data.strShipFrom}
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <template if:true={showQuantityFields}>
          <div class="slds-grid slds-wrap slds-p-around_medium slds-m-top_small info-section">
            <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
              <div class="lbl-field-name">{labels.pmc_quoteCheckoutFlow_quantity}</div>
              <div class="lbl-field-value">{selectedQuoteLineObj.intTotalQuantity}</div>
            </div>
            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12">
              <div class="lbl-field-name">{labels.pmc_contractDetails_validityPeriod}</div>
              <div class="lbl-field-value">
                {selectedQuoteLineObj.strStartDate}-{selectedQuoteLineObj.strEndDate}</div>
            </div>
            <div class="slds-col slds-size_12-of-12 slds-medium-size_2-of-12">
              <div class="lbl-field-name">{labels.pmc_requestToDeliverShippingInformation_frequency}</div>
              <div class="lbl-field-value">{labels.pmc_cadenceSuggestion_monthly}</div>
            </div>
          </div>
          <div class="header-text slds-p-around_small">
            {labels.pmc_cadenceSuggestion_infoText}
          </div>
          <div class="monthly-quantity-section">
            <div class="slds-grid slds-wrap slds-m-bottom_small label-section">
              <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12">
                <div class="lbl-field-name requested-qty">{labels.pmc_requestToDeliver_qty}</div>
              </div>
              <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12">
                <div class="lbl-field-name period-contracted">{labels.pmc_cadenceSuggestion_month}</div>
              </div>
              <template if:true={selectedQuoteLineObj.isMoreThanOneRecord}>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12 hide-small">
                  <div class="lbl-field-name requested-qty">{labels.pmc_requestToDeliver_qty}</div>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12 hide-small">
                  <div class="lbl-field-name period-contracted">{labels.pmc_cadenceSuggestion_month}</div>
                </div>
                <template if:true={selectedQuoteLineObj.isMoreThanTwoRecords}>
                  <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12 hide-small">
                    <div class="lbl-field-name requested-qty">{labels.pmc_requestToDeliver_qty}
                    </div>
                  </div>
                  <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12 hide-small">
                    <div class="lbl-field-name period-contracted">{labels.pmc_cadenceSuggestion_month}</div>
                  </div>
                </template>
              </template>
            </div>
            <div class="slds-grid slds-wrap input-section">
              <template for:each={selectedQuoteLineObj.lstCadence} for:item="lstItem">
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12" key={lstItem.strCadenceId}>
                  <template if:false={isReadOnly}>
                    <c-pmc_dh_input-element type="text" text-label={labels.pmc_quoteCheckoutFlow_quantity}
                      data-id="intQuantity" data-cadence-id={lstItem.strCadenceId} parent-name="intQuantity"
                      default-value={lstItem.intQuantity} oninputdatachange={handleDataChange} is-number>
                    </c-pmc_dh_input-element>
                  </template>
                  <template if:true={isReadOnly}>
                    <div class="lbl-field-value read-only-qty">{lstItem.intQuantity}</div>
                  </template>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12" key={lstItem.strCadenceId}>
                  <div class="lbl-field-value">{lstItem.strMonth}</div>
                </div>
              </template>
            </div>
          </div>
          <template if:true={warningMsg}>
            <div class="text-regular-small slds-m-bottom_small slds-p-horizontal_medium warning-msg">
              {warningMsg}
            </div>
          </template>
        </template>

        <div class="header-text slds-p-around_small">
          {labels.pmc_cadenceSuggestion_subjectToChange}
        </div>

        <template if:false={isReadOnly}>
          <div class="slds-grid slds-wrap slds-p-around_small call-to-action">
            <div class="slds-medium-size_1-of-2 slds-size_1-of-1 slds-medium-order_1 slds-order_2 mobile-button">
              <lightning-button variant="neutral" label={labels.pmc_addressDetails_cancel}
                title={labels.pmc_addressDetails_cancel} onclick={closeModalHandler}></lightning-button>
            </div>
            <div
              class="slds-medium-size_1-of-2 slds-size_1-of-1 slds-medium-order_2 slds-order_1 mobile-button button-style">
              <lightning-button variant="brand" label={labels.pmc_cadenceSuggestion_confirmCadenceSuggestion}
                disabled={isConfirmBtnDisabled} title={labels.pmc_cadenceSuggestion_confirmCadenceSuggestion}
                onclick={confirmBtnHandler}></lightning-button>
            </div>
          </div>
        </template>

      </template>
      <template if:true={isSpinner}>
        <c-pmc_dh_spinner is-spinner> </c-pmc_dh_spinner>
      </template>
    </div>
  </c-pmc_dh_custom-modal>
</template>
