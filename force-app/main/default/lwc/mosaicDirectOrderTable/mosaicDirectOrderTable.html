<template>
    <div class="order-manager-container">
        <div class="md-grid">
            <div class="md-box">
                <div class="md-header">
                    <p>{title} <template if:true={orderCount}>({orderCount})</template></p>
                </div>

                <div class="md-body">
                    <template if:true={showDeleteConfirm}>
                        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container">
                                <header class="slds-modal__header">
                                    <h2 class="slds-text-heading_medium">Confirm</h2>
                                </header>
                                <div class="slds-modal__content slds-p-around_medium">
                                    <p>Do you want to delete this order?</p>
                                </div>
                                <footer class="slds-modal__footer">
                                    <lightning-button variant="neutral" label="Cancel"
                                        onclick={cancelDeleteOrder}></lightning-button>
                                    <lightning-button variant="destructive" label="Delete"
                                        onclick={confirmDeleteOrder}></lightning-button>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>

                    <div class="placed-orders-section" if:true={hasOrders}>
                        <div class="orders-container">
                            <template for:each={placedOrders} for:item="order">
                                <div key={order.id} class="order-table-wrapper">

                                    <div class="order-actions">
                                        <a href="#" onclick={handleDeleteOrder} data-order-id={order.id}
                                            title="Delete Order">
                                            <lightning-icon icon-name="utility:delete" size="x-small"
                                                class="action-icon red-delete-icon"></lightning-icon> <span>Delete
                                                Order</span>
                                        </a>
                                    </div>

                                    <div class="order-table-container">
                                        <table class="order-table">
                                            <thead>
                                                <tr>
                                                    <th>Contract Item</th>
                                                    <th>Req. Shipment Date</th>
                                                    <th>OrderPO Number</th>
                                                    <th>Order QTY (t)</th>
                                                    <th>UOM</th>
                                                    <th>Ship Method</th>
                                                    <th>Origin</th>
                                                    <th>Ship To</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={order.items} for:item="item">
                                                    <tr key={item.id}>
                                                        <td>{item.contractItem}</td>
                                                        <td>
                                                            <template if:true={item._isEditing}>
                                                                <lightning-input type="date" data-order-id={order.id}
                                                                    data-item-id={item.id}
                                                                    value={item._editValues.reqShipmentDateISO}
                                                                    onchange={handleFieldChange} required min={minDate}
                                                                    max={maxDate} variant="label-hidden"
                                                                    class="small-input">
                                                                </lightning-input>
                                                                  <template if:true={item._validationDate}>
                                                                    <div class="error-text"
                                                                        style="color: #C23934; font-size: .75rem; margin-top: .25rem;">
                                                                        {item._validationDate}</div>
                                                                </template>
                                                            </template>
                                                            <template if:false={item._isEditing}>
                                                                {item.reqShipmentDate}
                                                            </template>
                                                        </td>
                                                        <td>
                                                            <template if:true={item._isEditing}>
                                                                <lightning-input data-order-id={order.id}
                                                                    data-item-id={item.id} value={item.orderNumber}
                                                                    onchange={handleFieldChange}                                            
                                                                    class="small-input" ></lightning-input>
                                                                    <template if:true={item._validationOrderNumber}>
                                                                    <div class="error-text"
                                                                        style="color: #C23934; font-size: .75rem; margin-top: .25rem;">
                                                                        {item._validationOrderNumber}</div>
                                                                </template>
                                                            </template>
                                                            <template if:false={item._isEditing}>
                                                                {item.orderNumber}
                                                            </template>
                                                        </td>
                                                        <td>
                                                            <template if:true={item._isEditing}>
                                                                <lightning-input type="number" data-order-id={order.id}
                                                                    data-item-id={item.id} value={item.orderQty}
                                                                    onchange={handleFieldChange}
                                                                    class="small-input"></lightning-input>
                                                                <template if:true={item._validationOrderQty}>
                                                                    <div class="error-text"
                                                                        style="color: #C23934; font-size: .75rem; margin-top: .25rem;">
                                                                        {item._validationOrderQty}</div>
                                                                </template>
                                                            </template>
                                                            <template if:false={item._isEditing}>
                                                                {item.orderQty}
                                                            </template>
                                                        </td>
                                                        <td>{item.uom}</td>
                                                        <td>{item.shipMethod}</td>
                                                        <td>{item.originDisplay}</td>
                                                        <td>{item.shipToLabel}</td>
                                                        <td class="action-icons">
                                                            <template if:false={item._isEditing}>
                                                                <a href="#" onclick={handleDeleteItem}
                                                                    data-order-id={order.id} data-item-id={item.id}
                                                                    title="Delete Order Item">
                                                                    <lightning-icon icon-name="utility:delete"
                                                                        size="x-small"
                                                                        class="action-icon delete-icon"></lightning-icon>
                                                                </a>

                                                                <a href="#" onclick={handleEditItem}
                                                                    data-order-id={order.id} data-item-id={item.id}
                                                                    title="Edit Order Item">
                                                                    <lightning-icon icon-name="utility:edit"
                                                                        size="x-small"
                                                                        class="action-icon edit-icon"></lightning-icon>
                                                                </a>
                                                            </template>
                                                            <template if:true={item._isEditing}>
                                                                <a href="#" onclick={handleSaveItem}
                                                                    data-order-id={order.id} data-item-id={item.id}
                                                                    title="Save">
                                                                    <lightning-icon icon-name="utility:save"
                                                                        size="x-small"
                                                                        class="action-icon save-icon"></lightning-icon>
                                                                </a>

                                                                <a href="#" onclick={handleCancelEdit}
                                                                    data-order-id={order.id} data-item-id={item.id}
                                                                    title="Cancel">
                                                                    <lightning-icon icon-name="utility:undo"
                                                                        size="x-small"
                                                                        class="action-icon cancel-icon"></lightning-icon>
                                                                </a>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="empty-state" if:false={hasOrders}>
                        <div class="empty-state-content">
                            <lightning-icon icon-name="standard:orders" size="large" class="empty-state-icon">
                            </lightning-icon>
                            <p class="empty-state-title">No Orders Placed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="submit-orders-footer slds-p-top_medium slds-text-align_right">
        <lightning-button variant="neutral" label="Cancel" title="Cancel Orders" onclick={openCancelConfirm}
            class="slds-m-right_small"></lightning-button>
        <lightning-button variant="brand" label="Submit Order" title="Submit Order"
            onclick={openSubmitConfirm}></lightning-button>
    </div>

    <template if:true={showCancelConfirm}>
        <div class="custom-modal-backdrop">
            <div class="custom-modal">
                <div class="custom-modal-body">
                    <div class="custom-modal-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L22 20H2L12 2Z" fill="#F8CB2E" stroke="#B8860B" stroke-width="0.5" />
                            <path d="M11 7H13V13H11V7Z" fill="#111" />
                            <path d="M11 15H13V17H11V15Z" fill="#111" />
                        </svg>
                    </div>
                    <div class="custom-modal-content">
                        <h2 class="custom-modal-title">You're about to cancel all orders</h2>
                        <p class="custom-modal-text">You're about to cancel all orders. Once confirmed, this
                            can't be
                            undone—are you sure you want to continue?</p>
                        <div class="custom-modal-actions">
                            <button class="btn-yellow" onclick={confirmCancel}>Yes, Cancel</button>
                            <button class="btn-green" onclick={backFromCancel}>Back</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template if:true={showSubmitConfirm}>
        <div class="custom-modal-backdrop">
            <div class="custom-modal">
                <div class="custom-modal-body">
                    <div class="custom-modal-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L22 20H2L12 2Z" fill="#34B48A" stroke="#2A8C6E" stroke-width="0.5" />
                            <path d="M10.2 12.5L11.6 13.9L14.8 10.7" stroke="#fff" stroke-width="1.6"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="custom-modal-content">
                        <h2 class="custom-modal-title">You're about to submit all your orders</h2>
                        <p class="custom-modal-text">You're about to submit all your orders. Ready to move
                            forward?</p>
                        <div class="custom-modal-actions">
                            <button class="btn-yellow" onclick={confirmSubmit}>Yes, Submit</button>
                            <button class="btn-green" onclick={backFromSubmitConfirm}>Back</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template if:true={showSuccessPopup}>
        <div class="custom-modal-backdrop">
            <div class="custom-modal">
                <div class="custom-close-container">
                    <div class="custom-close-icon" onclick={closeSuccessModal}>X</div>
                </div>

                <div class="custom-modal-body">
                    <div class="custom-modal-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="#34B48A" stroke="#2A8C6E" stroke-width="0.5" />
                            <path d="M8 12.5L11 15.5L16 9.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>

                    <div class="custom-modal-content">
                        <h2 class="custom-modal-title">Saved!</h2>
                        <p class="custom-modal-text mb-0">Your order(s) have been created and you'll receive an
                            email
                            confirmation with the order numbers.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
