<template>
  <div lwc:if={hasRecords} class="slds-m-top_small slds-grid slds-grid_align-spread slds-align_absolute-center">
    <div class="md-pagination slds-grid slds-grid_align-center slds-wrap">

      <div>
        <button class="md-pagination-button" onclick={handlePrevPage} disabled={isPrevDisabled}>
          <lightning-icon size="x-small" icon-name="utility:chevronleft"></lightning-icon>
        </button>
      </div>

      <div class="slds-grid slds-grid_vertical-align-center slds-m-horizontal_x-small">
        <button class="md-pagination-button" onclick={handlePageClick} data-page="1"
          data-active={isFirstPageActive}>1</button>

        <span lwc:if={showLeftEllipsis} class="slds-m-horizontal_x-small slds-align_absolute-center">...</span>

        <template for:each={pageButtons} for:item="btn">
          <button key={btn.key} class="md-pagination-button" onclick={handlePageClick} data-page={btn.page}
            data-active={btn.active}>{btn.label}</button>
        </template>

        <span lwc:if={showRightEllipsis} class="slds-m-horizontal_x-small slds-align_absolute-center">...</span>

        <button lwc:if={showLastPage} class="md-pagination-button" onclick={handlePageClick} data-page={totalPages}
          data-active={isLastPageActive}>{totalPages}</button>
      </div>

      <div>
        <button class="md-pagination-button" onclick={handleNextPage} disabled={isNextDisabled}>
          <lightning-icon size="x-small" icon-name="utility:chevronright"></lightning-icon>
        </button>
      </div>
    </div>
  </div>
</template>
